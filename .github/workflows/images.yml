name: Immagini

# Pubblica su GHCR solo da main e dai tag v*: mai dalle PR (nemmeno da fork).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      game-server: ${{ steps.diff.outputs.game-server }}
      control-plane: ${{ steps.diff.outputs.control-plane }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        name: Quali immagini sono cambiate
        env:
          BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -e
          all=true
          if [ "$REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] \
            && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            all=false
            files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          match() { # $1 = regex
            if [ "$all" = true ] || grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi
          }
          echo "game-server=$(match '^(\.dockerignore|server-agent/(src/|package(-lock)?\.json|tsconfig\.json)|docker/game-server/(Dockerfile|[a-z0-9-]+\.sh)|config/maps/)')" >> "$GITHUB_OUTPUT"
          echo "control-plane=$(match '^(\.dockerignore|control-plane/(backend|pwa)/(src/|public/|index\.html|package(-lock)?\.json|tsconfig\.json|vite\.config\.ts)|docker/control-plane/)')" >> "$GITHUB_OUTPUT"

  game-server:
    needs: changes
    if: needs.changes.outputs.game-server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: owner
        name: Owner GHCR minuscolo
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta-raw
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ark-ascended-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - id: meta-managed
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ark-ascended-server-managed
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build e pubblica raw (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/game-server/Dockerfile
          target: raw
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-raw.outputs.tags }}
          labels: ${{ steps.meta-raw.outputs.labels }}
          cache-from: type=gha,scope=game-server
          cache-to: type=gha,mode=max,scope=game-server
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

      # Dopo raw: gli stage condivisi arrivano dalla cache.
      - name: Build e pubblica managed (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/game-server/Dockerfile
          target: managed
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-managed.outputs.tags }}
          labels: ${{ steps.meta-managed.outputs.labels }}
          cache-from: type=gha,scope=game-server
          cache-to: type=gha,mode=max,scope=game-server
          build-args: |
            SOURCE_REVISION=${{ github.sha }}

  control-plane:
    needs: changes
    if: needs.changes.outputs.control-plane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: owner
        name: Owner GHCR minuscolo
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gli stage applicativi girano su $BUILDPLATFORM; lo stage finale non
      # esegue binari, quindi arm64 non richiede QEMU.
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ark-ascended-control-plane
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build e pubblica amd64 + arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/control-plane/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
